apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ include "mychart.deploy" . }}
  name: {{ include "mychart.deploy" . }}
  namespace: {{ include "mychart.namespace" . }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ include "mychart.deploy" . }}
  strategy: {}
  template:
    metadata:
      labels:
        app: {{ include "mychart.deploy" . }}
    spec:
      containers:
      - image: nginx:1.22
        name: nginx
        resources: {}
status: {}
