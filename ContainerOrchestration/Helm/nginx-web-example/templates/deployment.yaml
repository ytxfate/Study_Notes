apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ include "mychart.deploy" . }}
  name: {{ include "mychart.deploy" . }}
  namespace: {{ include "mychart.namespace" . }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "mychart.deploy" . }}
  strategy: {}
  template:
    metadata:
      labels:
        app: {{ include "mychart.deploy" . }}
      # annotations:
      #   时间戳注解, 让每次 upgrade 都更新 Deployment
      #   timestamp: {{ now | quote }}
    spec:
      containers:
      - image: nginx:1.22
        name: nginx
        resources: {}
status: {}
